name: build

# Builds the pack on every push and pull request, and publishes it as a GitHub
# Release when a v* tag is pushed. There is no changelog or metadata gate.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Build
        run: ./build.sh

      - name: Upload pack
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dialogue_tweaks-pck
          path: |
            dist/*.pck
            dist/*.pck.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pck
            dist/*.pck.sha256
          generate_release_notes: true
